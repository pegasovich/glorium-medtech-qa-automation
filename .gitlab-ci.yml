# ==============================================================================
# GitLab CI/CD Pipeline: Glorium MedTech Test Automation
# Stack: .NET 8, Playwright (C#), NUnit
# Features: Multi-stage, parallel browser matrix, JUnit reports, Playwright Tracing
# ==============================================================================

stages:
  - build
  - test-api
  - test-e2e
  - report

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/
    - "**/bin/"
    - "**/obj/"

default:
  image: mcr.microsoft.com/playwright/dotnet:v1.49.0-jammy

# ------------------------------------------------------------------------------
# Build & Restore
# ------------------------------------------------------------------------------
build:solution:
  stage: build
  script:
    - dotnet restore Glorium.MedTech.Automation.sln
    - dotnet build Glorium.MedTech.Automation.sln --no-restore --configuration Release
  artifacts:
    expire_in: 2 hours
    paths:
      - "**/bin/Release/"
      - "**/obj/"

# ------------------------------------------------------------------------------
# Stage 1: Fast API Tests (Contracts & Health)
# ------------------------------------------------------------------------------
test:api:
  stage: test-api
  needs: ["build:solution"]
  script:
    - dotnet test tests/Glorium.Tests.Api/Glorium.Tests.Api.csproj
        --no-build
        --configuration Release
        --logger:"junit;LogFilePath=$CI_PROJECT_DIR/TestResults/api-results.xml"
        --logger:"console;verbosity=normal"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: TestResults/api-results.xml
    paths:
      - TestResults/

# ------------------------------------------------------------------------------
# Stage 2: E2E Playwright Tests (Parallel Matrix across Browsers)
# ------------------------------------------------------------------------------
test:e2e:
  stage: test-e2e
  needs: ["build:solution"]
  parallel:
    matrix:
      - BROWSER: ["chromium", "firefox"]
  variables:
    PLAYWRIGHT_BROWSER: $BROWSER
    HEADLESS: "true"
  script:
    - dotnet test tests/Glorium.Tests.E2E/Glorium.Tests.E2E.csproj
        --no-build
        --configuration Release
        --logger:"junit;LogFilePath=$CI_PROJECT_DIR/TestResults/e2e-$BROWSER-results.xml"
        --logger:"console;verbosity=normal"
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      junit: TestResults/e2e-$BROWSER-results.xml
    paths:
      - TestResults/
      - playwright-traces/
      - screenshots/

# ------------------------------------------------------------------------------
# Stage 3: Merge & Publish Test Summary
# ------------------------------------------------------------------------------
pages:
  stage: report
  when: always
  needs: ["test:api", "test:e2e"]
  script:
    - mkdir -p public
    - echo "<html><body><h1>Glorium MedTech Test Execution Summary</h1><p>Commit $CI_COMMIT_SHORT_SHA on branch $CI_COMMIT_REF_NAME</p></body></html>" > public/index.html
  artifacts:
    paths:
      - public
